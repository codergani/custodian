<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Custodian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      :root, [data-theme="dark"] {
        color-scheme: dark;
        --bg-main: #06080D;
        --bg-ambient: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, rgba(0, 210, 255, 0.05) 30%, transparent 70%);
        --panel-main: #0B0E17;
        --panel-alt: #101522;
        --panel-card: #0F1420;
        --panel-glass: rgba(11, 14, 23, 0.82);
        --line-main: rgba(255, 255, 255, 0.08);
        --line-hover: rgba(0, 210, 255, 0.4);
        --line-subtle: rgba(255, 255, 255, 0.04);
        --text-main: #F8FAFC;
        --text-dim: #94A3B8;
        --text-faint: #64748B;
        --brand-cyan: #00D2FF;
        --brand-blue: #3A7BD5;
        --brand-indigo: #6366F1;
        --brand-violet: #8B5CF6;
        --brass-main: #00D2FF;
        --brass-dim: #4F46E5;
        --green-main: #10B981;
        --red-main: #F43F5E;
        --primary-btn-text: #FFFFFF;
        --sidebar-bg: #07090F;
        --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7), 0 0 1px 1px rgba(255, 255, 255, 0.06);
        --modal-overlay-bg: rgba(3, 4, 7, 0.82);
        --highlight-bg: rgba(0, 210, 255, 0.12);
        --scrollbar-thumb: rgba(255, 255, 255, 0.14);
        --scrollbar-thumb-hover: rgba(0, 210, 255, 0.4);
        --scrollbar-track: transparent;
        --aegis-gradient: linear-gradient(135deg, #00D2FF 0%, #3B82F6 50%, #6366F1 100%);
        --aegis-btn-glow: 0 4px 20px -2px rgba(0, 210, 255, 0.35);
      }
      [data-theme="light"] {
        color-scheme: light;
        --bg-main: #06080D;
        --panel-main: #0B0E17;
        --panel-alt: #101522;
        --panel-card: #0F1420;
        --panel-glass: rgba(11, 14, 23, 0.82);
        --line-main: rgba(255, 255, 255, 0.08);
        --line-hover: rgba(0, 210, 255, 0.4);
        --text-main: #F8FAFC;
        --text-dim: #94A3B8;
        --text-faint: #64748B;
        --brass-main: #00D2FF;
        --brass-dim: #4F46E5;
        --green-main: #10B981;
        --red-main: #F43F5E;
        --primary-btn-text: #FFFFFF;
        --sidebar-bg: #07090F;
        --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
        --modal-overlay-bg: rgba(3, 4, 7, 0.82);
        --highlight-bg: rgba(0, 210, 255, 0.12);
        --scrollbar-thumb: rgba(255, 255, 255, 0.14);
        --scrollbar-thumb-hover: rgba(0, 210, 255, 0.4);
        --scrollbar-track: transparent;
        --aegis-gradient: linear-gradient(135deg, #00D2FF 0%, #3B82F6 50%, #6366F1 100%);
        --aegis-btn-glow: 0 4px 20px -2px rgba(0, 210, 255, 0.35);
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg-main) !important;
        background-color: var(--bg-main) !important;
        background-image: var(--bg-ambient) !important;
        background-repeat: no-repeat !important;
        background-attachment: fixed !important;
        color: var(--text-main);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background 0.25s ease, color 0.25s ease;
      }
      .custodian-main {
        background: transparent !important;
        background-color: transparent !important;
      }
      input, button, textarea, select {
        font: inherit;
      }
      /* Keyboard Accessibility Focus Visible */
      :focus-visible {
        outline: 2px solid var(--brand-cyan) !important;
        outline-offset: 2px !important;
        box-shadow: 0 0 14px rgba(0, 210, 255, 0.4) !important;
      }
      /* Sleek Theme-Aware Custom Scrollbars */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 8px;
        transition: background 0.2s ease;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      ::-webkit-scrollbar-button {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      /* Aegis Cyber-Void Signature Glass & Card Hover System */
      .aegis-glass {
        background: var(--panel-glass) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border: 1px solid var(--line-main) !important;
      }
      .aegis-card {
        background: var(--panel-card) !important;
        border: 1px solid var(--line-main) !important;
        border-radius: 14px !important;
        box-shadow: var(--card-shadow) !important;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.22s ease, box-shadow 0.22s ease !important;
      }
      .aegis-card:hover {
        transform: translateY(-2px);
        border-color: rgba(0, 210, 255, 0.3) !important;
        box-shadow: 0 14px 34px -10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 210, 255, 0.1) !important;
      }
      .aegis-btn-primary {
        background: var(--aegis-gradient) !important;
        color: #FFFFFF !important;
        font-weight: 600 !important;
        border: none !important;
        box-shadow: var(--aegis-btn-glow) !important;
        transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease !important;
      }
      .aegis-btn-primary:hover {
        transform: translateY(-1px) !important;
        filter: brightness(1.1) !important;
        box-shadow: 0 6px 26px rgba(0, 210, 255, 0.45) !important;
      }
      .aegis-btn-primary:active {
        transform: scale(0.98) !important;
      }
      .aegis-input {
        background: var(--panel-alt) !important;
        border: 1px solid var(--line-main) !important;
        color: var(--text-main) !important;
        transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
      }
      .aegis-input:focus {
        border-color: var(--brand-cyan) !important;
        box-shadow: 0 0 0 2px rgba(0, 210, 255, 0.25) !important;
        outline: none !important;
      }
      /* Shimmer Animation for Skeletons */
      @keyframes shimmer {
        0% { opacity: 0.4; }
        50% { opacity: 0.85; }
        100% { opacity: 0.4; }
      }
      .skeleton-shimmer {
        animation: shimmer 1.5s ease-in-out infinite;
      }
      /* Floating Toast Slide-In Animation */
      @keyframes slideInToast {
        from { transform: translateY(20px) scale(0.96); opacity: 0; }
        to { transform: translateY(0) scale(1); opacity: 1; }
      }
      /* Tab hover/focus micro-interactions */
      button:hover {
        filter: brightness(1.08);
      }
      button:active {
        transform: scale(0.97);
      }
      /* Hide scrollbars on horizontal tabs while keeping smooth touch/wheel scroll */
      .projectTabNav::-webkit-scrollbar,
      .custodian-hscroll::-webkit-scrollbar {
        display: none !important;
      }
      .custodian-hscroll {
        display: flex !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
        scroll-behavior: smooth !important;
      }
      .custodian-hscroll > * {
        flex-shrink: 0 !important;
        white-space: nowrap !important;
      }
      /* Mobile Drawer Overlay Backdrop */
      .custodian-sidebar-backdrop {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        background: rgba(0, 0, 0, 0.72) !important;
        backdrop-filter: blur(4px) !important;
        -webkit-backdrop-filter: blur(4px) !important;
        z-index: 998 !important;
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1) !important;
      }
      .custodian-sidebar-backdrop.open {
        opacity: 1 !important;
        pointer-events: auto !important;
      }

      /* Mobile Drawer Overlay Rules */
      @media (max-width: 768px) {
        .custodian-sidebar {
          position: fixed !important;
          top: 0 !important;
          bottom: 0 !important;
          left: 0 !important;
          width: 330px !important;
          max-width: 86vw !important;
          z-index: 999 !important;
          transform: translateX(-105%) !important;
          transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1) !important;
          box-shadow: 6px 0 36px rgba(0, 0, 0, 0.85) !important;
          border-right: 1px solid rgba(176, 141, 87, 0.3) !important;
          overflow-y: auto !important;
          -webkit-overflow-scrolling: touch !important;
          height: 100vh !important;
          padding: 16px 14px 44px !important;
          box-sizing: border-box !important;
        }
        .custodian-sidebar.open {
          transform: translateX(0) !important;
        }
        .custodian-sidebar .sidebar-nav-btn {
          min-height: 40px !important;
          font-size: 13px !important;
          padding: 8px 10px !important;
        }
        .custodian-sidebar .sidebar-search-btn {
          padding: 10px 12px !important;
          font-size: 13px !important;
        }
        /* Make mobile sidebar tree flow naturally inside drawer without nested scroll traps */
        .custodian-sidebar .custodian-tree-scroll {
          overflow-y: visible !important;
          flex: none !important;
        }
        .custodian-main {
          margin-left: 0 !important;
          width: 100% !important;
          max-width: 100vw !important;
          padding: 0 14px 28px !important;
          box-sizing: border-box !important;
          flex: 1 1 100% !important;
          -webkit-overflow-scrolling: touch !important;
        }
        .mobile-only-header {
          display: flex !important;
          align-items: center;
          justify-content: space-between;
          padding: 12px 14px;
          background: var(--bg-main);
          border-bottom: 1px solid var(--line-main);
          position: sticky;
          top: 0;
          z-index: 100;
          margin: 0 -14px 14px -14px;
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
        }
        .mobile-drawer-close {
          display: flex !important;
        }
        /* Mobile Modal Overlay Scrolling & Soft Keyboard Clearance */
        .custodian-modal-overlay {
          align-items: flex-start !important;
          padding: 14px 10px 48px !important;
          overflow-y: auto !important;
          -webkit-overflow-scrolling: touch !important;
          box-sizing: border-box !important;
        }
        .custodian-modal-card {
          width: 100% !important;
          max-width: 100% !important;
          max-height: 88vh !important;
          overflow-y: auto !important;
          -webkit-overflow-scrolling: touch !important;
          margin: auto 0 !important;
          box-sizing: border-box !important;
        }
        /* Mobile Command Palette */
        .custodian-cmd-overlay {
          align-items: flex-start !important;
          padding-top: 18px !important;
          overflow-y: auto !important;
          -webkit-overflow-scrolling: touch !important;
        }
        /* Mobile Document Annotation Scratchpad Drawer */
        .custodian-scratchpad-drawer {
          position: absolute !important;
          right: 0 !important;
          top: 0 !important;
          bottom: 0 !important;
          width: 85% !important;
          max-width: 320px !important;
          box-shadow: -10px 0 40px rgba(0, 0, 0, 0.85) !important;
        }
      }
      @media (min-width: 769px) {
        .mobile-only-header {
          display: none !important;
        }
        .custodian-sidebar-backdrop {
          display: none !important;
        }
        .mobile-drawer-close {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
